name: Build AiFlex2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-aiflex2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install ldid xz
          xcodebuild -version

      # 不再调用 update-theos：它会 init 全部子模块，其中 theos/orion 已不再公开，
      # clone 时会退化成询问 Username 并直接失败（构建挂在 Install Theos，与代码无关）。
      # 构建只需要 dm.pl、头文件、lib 和 logos。
      - name: Install Theos
        run: |
          set -uo pipefail
          git clone --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/dm.pl.git "$RUNNER_TEMP/theos/vendor/dm.pl"
          chmod +x "$RUNNER_TEMP/theos/vendor/dm.pl/dm.pl"
          for module in include lib logos; do
            rm -rf "$RUNNER_TEMP/theos/vendor/$module"
            git clone --depth 1 "https://github.com/theos/$module.git" "$RUNNER_TEMP/theos/vendor/$module" \
              || echo "warning: vendor/$module 不可用，继续构建"
          done
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          ln -sfn "$(xcrun --sdk iphoneos --show-sdk-path)" "$RUNNER_TEMP/theos/sdks/iPhoneOS.sdk"
          test -x "$RUNNER_TEMP/theos/vendor/dm.pl/dm.pl"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/vendor/dm.pl" >> "$GITHUB_PATH"

      - name: Build AiFlex2
        run: make clean package FINALPACKAGE=1 DEBUG=0 -j1

      - name: List artifacts
        run: |
          ls -lh *.deb *.dylib

      - name: Upload dylib and deb
        uses: actions/upload-artifact@v4
        with:
          name: AiFlex2
          path: |
            *.deb
            *.dylib
          if-no-files-found: error
